name: Kased CI (cotis_app)

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

# NOTE: Ce workflow est conservé pour les PRs et le linting local.
# Le build APK de production utilise le workflow racine
# (.github/workflows/build-release.yml) qui est la source de vérité.

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze:
    name: Analyse statique
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Analyser le code
        run: flutter analyze --no-pub --no-fatal-infos

  test:
    name: Tests unitaires & widgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Exécuter les tests
        run: flutter test test/unit/ test/widget/ --no-pub --reporter expanded

  # NOTE: Le build APK release est réalisé par le workflow racine
  # .github/workflows/build-release.yml (source de vérité).
  # Ce workflow ne fait que du lint/test pour les PRs.
