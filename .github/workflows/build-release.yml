name: Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'cotis_app/pubspec.yaml'
      - 'cotis_app/lib/**'
      - 'cotis_app/android/**'
      - 'cotis_app/test/**'
      - 'cotis_app/*.md'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de bump (patch, minor, major)'
        required: false
        default: 'patch'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  JAVA_VERSION: '21'

jobs:
  build-and-release:
    name: Analyze → Build → Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cotis_app

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Flutter SDK ───────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Android SDK Platform 36
        run: |
          sdkmanager "platforms;android-36" <<< "y" || true
          echo "✅ Android SDK Platform 36 prêt"

      # ── 3. Extraire la version depuis pubspec.yaml ───────────────────────────
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | head -1)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version détectée : $VERSION"

      # ── 4. Décoder le keystore (base64 → fichier .jks) ──────────────────────
      - name: Decode keystore
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ]; then
            echo "::error::Secret UPLOAD_KEYSTORE_B64 manquant : l'APK serait signé avec le keystore de debug, dont le SHA-1 n'est pas déclaré dans Firebase → Google Sign-In échoue avec ApiException 10."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          echo "✅ upload-keystore.jks décodé ($(stat -c%s android/upload-keystore.jks) octets)"

      # ── 5. Créer key.properties ──────────────────────────────────────────────
      - name: Create key.properties
        run: |
          cat > android/key.properties << 'KEYPROPS'
          storeFile=../upload-keystore.jks
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          KEYPROPS
          echo "✅ android/key.properties créé"

      # ── 6. Décoder google-services.json ──────────────────────────────────────
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "⚠️  GOOGLE_SERVICES_JSON_B64 non défini — le fichier versionné est utilisé"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          echo "✅ google-services.json décodé ($(stat -c%s android/app/google-services.json) octets)"

      # ── 6b. Cohérence Google Sign-In (SHA-1 ↔ client OAuth Android) ─────────
      # Sans client OAuth Android déclarant le SHA-1 du keystore de signature,
      # google_sign_in échoue avec ApiException: 10 sur tous les appareils.
      - name: Vérifier la configuration Google Sign-In
        run: |
          python3 ../scripts/verifier-google-signin.py \
            --google-services android/app/google-services.json \
            --keystore android/upload-keystore.jks \
            --keystore-password '${{ secrets.KEYSTORE_PASSWORD }}' \
            --key-alias '${{ secrets.KEY_ALIAS }}' \
            --web-client-id '${{ secrets.GOOGLE_WEB_CLIENT_ID }}'

      # ── 7. Dependencies ──────────────────────────────────────────────────────
      - name: Pub get
        run: flutter pub get
      - name: Patch isar_flutter_libs namespace for AGP compatibility
        run: |
          echo "Starting isar_flutter_libs AGP 8.x compatibility patches..."
          # Find the isar_flutter_libs build.gradle
          ISAR_GRADLE=$(find ~ -path "*isar_flutter_libs*/android/build.gradle" -type f 2>/dev/null | head -1)
          if [ -z "$ISAR_GRADLE" ]; then
            echo "ERROR: Could not find isar_flutter_libs build.gradle"
            exit 1
          fi
          echo "Found build.gradle at: $ISAR_GRADLE"
          if ! grep -q "namespace" "$ISAR_GRADLE"; then
            echo "Adding namespace to $ISAR_GRADLE..."
            sed -i '/^android {/a\    namespace = "dev.isar.isar_flutter_libs"' "$ISAR_GRADLE"
            echo "Namespace added."
          else
            echo "Namespace already present, skipping."
          fi
          # compileSdk 36 must REPLACE the plugin's own compileSdkVersion line:
          # that line runs AFTER any inserted compileSdk = 36 and would override
          # it (last assignment wins in Groovy), leaving isar on SDK 30 where the
          # SDK 35+ attribute android:attr/lStar does not exist.
          sed -i 's/^[[:space:]]*compileSdkVersion[[:space:]]*[0-9]*/    compileSdk = 36/' "$ISAR_GRADLE"
          if ! grep -q "compileSdk" "$ISAR_GRADLE"; then
            echo "Adding compileSdk 36 to prevent lStar resource errors..."
            sed -i '/^android {/a\    compileSdk = 36' "$ISAR_GRADLE"
            echo "compileSdk added."
          else
            echo "compileSdk ensured at 36."
          fi
          # Find and patch AndroidManifest.xml - remove deprecated package attribute
          ISAR_MANIFEST=$(find ~ -path "*isar_flutter_libs*/android/src/main/AndroidManifest.xml" -type f 2>/dev/null | head -1)
          if [ -n "$ISAR_MANIFEST" ]; then
            echo "Found AndroidManifest.xml at: $ISAR_MANIFEST"
            if grep -q 'package=' "$ISAR_MANIFEST"; then
              echo "Removing deprecated package attribute from AndroidManifest.xml..."
              sed -i 's/package="[^"]*"//g' "$ISAR_MANIFEST"
              echo "Manifest patched successfully."
            else
              echo "No package attribute found, skipping manifest patch."
            fi
          else
            echo "WARNING: AndroidManifest.xml not found for isar_flutter_libs"
          fi
          echo "Patch completed successfully."

      - name: Dart analyze
        run: dart analyze --no-fatal-warnings --no-fatal-infos --no-fatal-infos

      # ── 9. Code generation (Riverpod, Isar, etc.) ────────────────────────────
      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true

      # ── 11. Tests unitaires ────────────────────────────────────────────────────
      - name: Flutter test
        run: flutter test test/unit/
        continue-on-error: true

      # ── 11b. Vérifier les secrets requis (éviter les APK cassés) ─────────────
      # Un fallback 'placeholder' produit un APK où l'auth échoue :
      #  - INSFORGE_ANON_KEY absent → inscription email "No token provided"
      #  - GOOGLE_WEB_CLIENT_ID absent → Google Sign-In ApiException 10
      # Le build doit donc ÉCHOUER si ces secrets ne sont pas configurés.
      - name: Vérifier les secrets requis
        run: |
          if [ -z "${{ secrets.INSFORGE_URL }}" ]; then
            echo "::error::Secret INSFORGE_URL manquant : ajoutez l'URL de votre instance InsForge dans Settings → Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.INSFORGE_ANON_KEY }}" ]; then
            echo "::error::Secret INSFORGE_ANON_KEY manquant : ajoutez la clé anon InsForge (Settings → Secrets). Sans elle, l'inscription email répond 'No token provided'."
            exit 1
          fi
          if [ -z "${{ secrets.GOOGLE_WEB_CLIENT_ID }}" ]; then
            echo "::error::Secret GOOGLE_WEB_CLIENT_ID manquant : ajoutez le Web Client ID Google OAuth du projet (Settings → Secrets). Sans lui, Google Sign-In échoue avec ApiException 10."
            exit 1
          fi
          if [ -z "${{ secrets.GOOGLE_AUTH_BRIDGE_URL }}" ]; then
            echo "::error::Secret GOOGLE_AUTH_BRIDGE_URL manquant : utilisez https://<projet>.insforge.app/functions/google-auth-bridge."
            exit 1
          fi
          echo "✅ Secrets requis présents"

      # ── 12. Build APK Release (fat, toutes architectures) ────────────────────
      # APK unique contenant toutes les ABIs (arm64-v8a, armeabi-v7a, x86_64)
      # pour une compatibilité maximale sur tous les appareils Android.
      # Pas d'obfuscation : elle n'apporte aucun gain fonctionnel et peut
      # provoquer des crashs au lancement sur certains appareils.
      - name: Build APK (release)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
        run: |
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation \
            --dart-define=INSFORGE_BASE_URL=${{ secrets.INSFORGE_URL }} \
            --dart-define=INSFORGE_ANON_KEY=${{ secrets.INSFORGE_ANON_KEY }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN || '' }} \
            --dart-define=GOOGLE_AUTH_BRIDGE_URL=${{ secrets.GOOGLE_AUTH_BRIDGE_URL }}

      # ── 13. Renommer l'APK ───────────────────────────────────────────────────
      - name: Rename APK
        id: apk
        run: |
          mkdir -p build
          APK_NAME="kased-v${{ env.APP_VERSION }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/$APK_NAME"
          echo "apk_names=$APK_NAME" >> $GITHUB_OUTPUT
          echo "✅ APK → $APK_NAME ($(du -h "build/$APK_NAME" | cut -f1))"

      # ── 14. Upload APKs (artifact CI) ───────────────────────────────────────
      # NOTE: actions/upload-artifact and softprops/action-gh-release run at the
      # repo ROOT, not in cotis_app/ — the working-directory default only applies
      # to `run` steps. Prefix the artifact path with cotis_app/ accordingly.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kased-v${{ env.APP_VERSION }}
          path: cotis_app/build/kased-v${{ env.APP_VERSION }}.apk
          retention-days: 30
          compression-level: 9

      # ── 15. Create GitHub Release ───────────────────────────────────────────
      # Note: GitHub releases are immutable once published — we use overwrite_files
      # to replace the APK asset instead of deleting the old one (which is forbidden).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 'Kased v${{ env.APP_VERSION }}'
          body: |
            ## Kased v${{ env.APP_VERSION }}

            **APK Release** généré automatiquement depuis `${{ github.sha }}`.

            ### Build info
            - Flutter ${{ env.FLUTTER_VERSION }}
            - Commit [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - Build ${{ github.run_number }}

            ### APK universel (fat)
            - `kased-v${{ env.APP_VERSION }}.apk` — **une seule APK pour tous les appareils** (arm64-v8a, armeabi-v7a et x86_64 inclus, ~67 Mo)

            ### Notes
            - APK signé, compatible avec **tous** les appareils Android (compatibilité complète)
            - Build non obfusqué pour une fiabilité maximale au lancement
          files: cotis_app/build/kased-v${{ env.APP_VERSION }}.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
