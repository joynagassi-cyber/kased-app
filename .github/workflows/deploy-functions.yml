name: Deploy InsForge Functions

on:
  push:
    branches: [main]
    paths:
      - 'cotis_app/functions/**'
      - 'scripts/deploy-insforge-functions.sh'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Nom de la fonction à déployer (push-notify, google-auth-bridge, ou all)'
        required: false
        default: 'all'

env:
  INSFORGE_BASE_URL: ${{ secrets.INSFORGE_URL }}

jobs:
  deploy:
    name: Deploy Functions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          if [ -z "${{ secrets.INSFORGE_ANON_KEY }}" ]; then
            echo "::error::Secret INSFORGE_ANON_KEY manquant"
            exit 1
          fi
          echo "✅ Secrets OK"

      - name: Deploy functions
        env:
          INSFORGE_ANON_KEY: ${{ secrets.INSFORGE_ANON_KEY }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY || '' }}
        run: |
          chmod +x scripts/deploy-insforge-functions.sh
          INSFORGE_BASE_URL="$INSFORGE_BASE_URL" \
          INSFORGE_ANON_KEY="$INSFORGE_ANON_KEY" \
          ONESIGNAL_REST_API_KEY="$ONESIGNAL_REST_API_KEY" \
          ./scripts/deploy-insforge-functions.sh
